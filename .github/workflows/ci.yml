name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '0 0 * * *'

jobs:
  pint:
    name: Pint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install dependencies
        run: >-
          docker compose run --rm --no-deps -T php
          composer install --prefer-dist --no-interaction --no-progress

      - name: Check code style
        run: docker compose run --rm --no-deps -T php composer test:style

  tests:
    name: 'PHP ${{ matrix.php }} - Laravel: ${{ matrix.laravel }} - ${{ matrix.stability }}'
    needs: [pint]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
        stability: ['prefer-lowest', 'prefer-stable']
        laravel: ['^10.0', '^11.0', '^12.0', '^13.0']
        exclude:
          - php: '8.1'
            laravel: '^11.0'
          - php: '8.1'
            laravel: '^12.0'
          - php: '8.1'
            laravel: '^13.0'
          - php: '8.2'
            laravel: '^13.0'

    env:
      PHP_VERSION: ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Start containers
        run: docker compose up -d --build app rabbitmq

      - name: Install dependencies
        run: >-
          docker compose exec -T app
          composer update --with="laravel/framework:${{ matrix.laravel }}"
          --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

      - name: Wait for RabbitMQ
        run: >-
          docker compose exec -T app php -r
          'for ($i = 0; $i < 60; $i++) { if (@fsockopen("rabbitmq", 5672, $e, $s, 1)) { exit(0); } sleep(1); }
          fwrite(STDERR, "RabbitMQ did not become reachable in time\n"); exit(1);'

      - name: Execute tests
        run: docker compose exec -T app composer test:unit

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs
